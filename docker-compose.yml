services:
  llm-model:
    build: ./llm-model
    environment:
      LLM_MODEL_NAME: qwen2.5:0.5b-instruct
    volumes:
      - llm_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q \"$${LLM_MODEL_NAME}\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      LLM_BASE_URL: http://llm-model:11434
      LLM_MODEL_NAME: qwen2.5:0.5b-instruct
    volumes:
      - ./data/input:/app/data/input
    depends_on:
      llm-model:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://192.168.1.69:8000
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  llm_models:
