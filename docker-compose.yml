services:
  postgres:
    image: pgvector/pgvector:pg16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      # Host port 5433, not 5432 — this machine already has a native Postgres
      # install bound to 5432 (see handoff doc for how this was diagnosed), and
      # Docker's published port silently loses that race for external clients.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  llm-model:
    build: ./llm-model
    environment:
      LLM_MODEL_NAME: qwen2.5:0.5b-instruct
    volumes:
      - llm_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q \"$${LLM_MODEL_NAME}\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      LLM_BASE_URL: http://llm-model:11434
      LLM_MODEL_NAME: qwen2.5:0.5b-instruct
      # Internal Docker network: the postgres container's own port (always 5432),
      # not the 5433 host-mapped port used by external tools like DBeaver.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    volumes:
      - ./data/input:/app/data/input
      - ./backend/pipeline-logs:/app/pipeline-logs
    depends_on:
      llm-model:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://192.168.1.69:8000
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  llm_models:
  pgdata:
