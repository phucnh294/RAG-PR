services:
  postgres:
    image: pgvector/pgvector:pg16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      # Host port 5433, not 5432 — this machine already has a native Postgres
      # install bound to 5432 (see handoff doc for how this was diagnosed), and
      # Docker's published port silently loses that race for external clients.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  llm-model:
    build: ./llm-model
    env_file: .env
    ports:
      # Host port 8001 -> Ollama's own 11434, so the model can be verified
      # directly (e.g. `curl http://localhost:8001/api/tags`) without going
      # through the backend. Internal service-to-service calls still use
      # http://llm-model:11434 over the Docker network, unaffected by this.
      - "8001:11434"
    volumes:
      - llm_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q \"$${LLM_MODEL_NAME}\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  embedding-model:
    build: ./embedding-model
    env_file: .env
    volumes:
      - embedding_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q \"$${EMBEDDING_MODEL_NAME}\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  reranker-model:
    # Cross-encoder ms-marco-MiniLM-L6-v2 (ONNX Runtime, CPU), model baked into the image
    # at a pinned revision — see reranker-model/Dockerfile. Internal only, like
    # embedding-model: the backend reaches it at http://reranker-model:8080.
    build: ./reranker-model
    environment:
      # ONNX Runtime threads: ~physical cores. Measured on the dev box (12 logical CPUs
      # in Docker): 6 threads = 2.2 s per 20 chunks, 12 threads = 3.7 s (hyperthreads
      # contend), 1 thread = 7 s. Tune via RERANKER_THREADS in .env for other machines.
      ORT_INTRA_OP_THREADS: ${RERANKER_THREADS:-6}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Everything else (LLM_PROVIDER, LLM_MODEL_NAME, GOOGLE_API_KEY, GOOGLE_MODEL_NAME,
      # EMBEDDING_MODEL_NAME, ...) comes straight from .env above — change it there, not
      # here. Only the Docker-network-internal addresses below stay hardcoded: they're
      # fixed by this compose file's own service names/ports, not something .env controls.
      LLM_BASE_URL: http://llm-model:11434
      EMBEDDING_BASE_URL: http://embedding-model:11434
      RERANKER_BASE_URL: http://reranker-model:8080
      # postgres container's own port (always 5432), not the 5433 host-mapped port
      # used by external tools like DBeaver.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    volumes:
      - ./data/input:/app/data/input
      - ./backend/pipeline-logs:/app/pipeline-logs
    depends_on:
      llm-model:
        condition: service_healthy
      embedding-model:
        condition: service_healthy
      # Started, not healthy: chat falls back to the hybrid order while the reranker is
      # still downloading its model (or down), so it must not block the backend.
      reranker-model:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://192.168.1.69:8000
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  llm_models:
  embedding_models:
  pgdata:
