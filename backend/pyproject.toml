[project]
name = "rag-backend"
version = "0.1.0"
description = "RAG pipeline backend (upload + chat API)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "asyncpg>=0.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# golden_set.json is read at runtime via Path(__file__).parent (see eval/golden_set.py)
# — setuptools excludes non-.py files from an installed package by default, so this
# needs to be declared explicitly or `pip install .` (see backend/Dockerfile) silently
# drops the file and eval/golden_set.py raises FileNotFoundError at request time.
rag_backend = ["eval/*.json"]
