server {
    listen 8080;
    server_name _;
    # Relative redirects, so /myweb -> /myweb/ keeps whatever host:port the caller used
    # (localhost:8080 from the browser, myweb:8080 from the test-runner container).
    absolute_redirect off;
    root /usr/share/nginx/html;

    location = / {
        return 302 /myweb/;
    }

    location = /myweb {
        return 301 /myweb/;
    }

    location /myweb/ {
        index index.html;
        try_files $uri $uri/ /myweb/index.html;
    }
}
